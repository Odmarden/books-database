{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card form-card">
            <div class="card-header">
                <h4 class="mb-0"><i class="bi bi-image"></i> Ändra omslagsbild</h4>
            </div>
            <div class="card-body p-4 text-center">
                <h5 class="card-title">{{ bok[1] }}</h5>
                <p class="text-muted mb-4">av {{ bok[2] }}</p>

                {% if bok[3] %}
                <div class="mb-4">
                    <img src="{{ url_for('thumbnail', filename=bok[3]) }}" alt="Nuvarande omslagsbild" class="cover-preview" style="height: 200px; width: 140px;">
                    <p class="small text-muted mt-2">Nuvarande omslagsbild</p>
                </div>
                {% endif %}

                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-4 text-start">
                        <label for="thumbnail" class="form-label fw-bold">Välj ny bild</label>
                        <input class="form-control" type="file" id="thumbnail" name="thumbnail" accept=".jpg,.jpeg,.png,.gif,.webp" required>
                        <div class="form-text">Tillåtna format: jpg, jpeg, png, gif, webp.</div>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                        <a href="{{ url_for('index') }}" class="btn btn-light me-md-2">Avbryt</a>
                        <button type="submit" class="btn btn-primary">Spara bild</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
