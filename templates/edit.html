{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card form-card">
            <div class="card-header">
                <h4 class="mb-0"><i class="bi bi-pencil-square"></i> Redigera bok</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('edit_book', bok_id=bok[0]) }}" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="titel" class="form-label fw-bold">Titel *</label>
                        <input type="text" class="form-control" id="titel" name="titel" value="{{ bok[1] }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="forfattare" class="form-label fw-bold">Författare *</label>
                        <input type="text" class="form-control" id="forfattare" name="forfattare" value="{{ bok[2] }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="kategori" class="form-label fw-bold">Kategori</label>
                        <select class="form-select" id="kategori" name="kategori">
                            {% for k in kategorier %}
                            <option value="{{ k }}" {% if bok[3] == k %}selected{% endif %}>{{ k }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="tryckaar" class="form-label fw-bold">Tryckår</label>
                            <input type="number" class="form-control" id="tryckaar" name="tryckaar" min="1000" max="2100" value="{{ bok[4] if bok[4] else '' }}">
                        </div>
                        <div class="col-md-6 mt-3 mt-md-0">
                            <label for="forlag" class="form-label fw-bold">Förlag</label>
                            <input type="text" class="form-control" id="forlag" name="forlag" value="{{ bok[5] if bok[5] else '' }}">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="thumbnail" class="form-label fw-bold">Ny omslagsbild (valfritt)</label>
                        <div class="d-flex align-items-center mb-2">
                            {% if bok[6] %}
                            <img src="{{ url_for('thumbnail', filename=bok[6]) }}" alt="Nuvarande omslag" class="cover-preview me-3">
                            <small class="text-muted">Nuvarande bild</small>
                            {% endif %}
                        </div>
                        <input class="form-control" type="file" id="thumbnail" name="thumbnail" accept=".jpg,.jpeg,.png,.gif,.webp">
                        <div class="form-text">Tillåtna format: jpg, jpeg, png, gif, webp. Lämna tomt för att behålla nuvarande bild.</div>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('index') }}" class="btn btn-light me-md-2">Avbryt</a>
                        <button type="submit" class="btn btn-warning">Spara ändringar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
